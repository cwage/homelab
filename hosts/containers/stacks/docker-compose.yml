services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/traefik/certs:ro
      - ./traefik-tls.yml:/etc/traefik/tls.yml:ro
      - ./traefik-basicauth:/etc/traefik/basicauth:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.lan.quietlife.net`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.usersfile=/etc/traefik/basicauth"
    networks:
      - proxy

  jellyfin:
    image: linuxserver/jellyfin:10.11.6
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.lan.quietlife.net`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    networks:
      - proxy
    devices:
      - "nvidia.com/gpu=all"

  sabnzbd:
    image: linuxserver/sabnzbd:4.5.5
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - sabnzbd_config:/config
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.lan.quietlife.net`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
    networks:
      - proxy

  radarr:
    image: linuxserver/radarr:6.0.4
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - radarr_config:/config
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.lan.quietlife.net`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    networks:
      - proxy

  sonarr:
    image: linuxserver/sonarr:4.0.16
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - sonarr_config:/config
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.lan.quietlife.net`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    networks:
      - proxy

  paperless-redis:
    image: docker.io/library/redis:8.0.5
    container_name: paperless-redis
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - paperless_redis:/data
    networks:
      - proxy

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.6
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-redis
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - USERMAP_UID=1000
      - USERMAP_GID=1000
      - PAPERLESS_TIME_ZONE=America/Chicago
      - PAPERLESS_URL=https://paperless.lan.quietlife.net
    volumes:
      - /mnt/nas/paperless/data:/usr/src/paperless/data
      - /mnt/nas/paperless/media:/usr/src/paperless/media
      - /mnt/nas/paperless/export:/usr/src/paperless/export
      - /mnt/nas/paperless/consume:/usr/src/paperless/consume
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.lan.quietlife.net`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.tls=true"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    networks:
      - proxy

  staticomment:
    image: ghcr.io/cwage/staticomment:0.3.0
    container_name: staticomment
    restart: unless-stopped
    environment:
      - STATICOMMENT_GIT_REPO=${STATICOMMENT_GIT_REPO}
      - STATICOMMENT_BRANCH=${STATICOMMENT_BRANCH:-main}
      - STATICOMMENT_ALLOWED_ORIGINS=${STATICOMMENT_ALLOWED_ORIGINS}
      - STATICOMMENT_TURNSTILE_SECRET=${STATICOMMENT_TURNSTILE_SECRET:-}
      - STATICOMMENT_SSH_KEY_PATH=/app/.ssh/id_ed25519
    volumes:
      - ./staticomment-ssh:/app/.ssh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staticomment.rule=Host(`staticomment.lan.quietlife.net`)"
      - "traefik.http.routers.staticomment.entrypoints=websecure"
      - "traefik.http.routers.staticomment.tls=true"
      - "traefik.http.services.staticomment.loadbalancer.server.port=8080"
    networks:
      - proxy

  # Public-only, exposed via the Cloudflare Tunnel at pad.quietlife.net.
  # CryptPad is end-to-end encrypted (the decryption key lives in the URL
  # fragment) and requires a SECOND "sandbox" origin for security isolation,
  # hence pad-sandbox.quietlife.net. cloudflared reaches it over the proxy
  # network: HTTP on :3000 and the realtime WebSocket on :3003
  # (/cryptpad_websocket) — both tunnel routes are configured in the
  # Cloudflare Zero Trust dashboard. OnlyOffice is intentionally not
  # installed; the markdown (Code) and rich-text apps don't need it.
  cryptpad:
    image: cryptpad/cryptpad:version-2026.5.1
    container_name: cryptpad
    restart: unless-stopped
    environment:
      - CPAD_MAIN_DOMAIN=https://pad.quietlife.net
      - CPAD_SANDBOX_DOMAIN=https://pad-sandbox.quietlife.net
      - CPAD_CONF=/cryptpad/config/config.js
    volumes:
      - cryptpad_config:/cryptpad/config
      - cryptpad_datastore:/cryptpad/datastore
      - cryptpad_data:/cryptpad/data
      - cryptpad_blob:/cryptpad/blob
      - cryptpad_block:/cryptpad/block
      - cryptpad_customize:/cryptpad/customize
    # CryptPad recommends a generous fd limit; 65536 is ample for this small
    # instance and well under any host's hard max (avoids host-dependent
    # `compose up` failures from over-requesting).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - proxy

  # Self-hosted git forge, evaluation instance for the GitHub migration
  # (issue #129 Phase 0). Web UI via Traefik at git.lan.quietlife.net;
  # git-over-SSH on host port 2222 (the VM's own sshd owns 22), which is
  # also the port advertised in clone URLs. INSTALL_LOCK skips the web
  # installer since config comes from these env vars; the admin account is
  # created via the forgejo CLI, and self-registration stays off.
  forgejo-db:
    image: postgres:17.10
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=forgejo
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD}
    volumes:
      - forgejo_db:/var/lib/postgresql/data
    networks:
      - proxy

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.5
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      - forgejo-db
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=America/Chicago
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - FORGEJO__server__DOMAIN=git.lan.quietlife.net
      - FORGEJO__server__ROOT_URL=https://git.lan.quietlife.net/
      - FORGEJO__server__SSH_DOMAIN=git.lan.quietlife.net
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
    volumes:
      - forgejo_data:/data
    ports:
      - "2222:22"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`git.lan.quietlife.net`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls=true"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
    networks:
      - proxy

  cloudflared:
    image: cloudflare/cloudflared:2026.1.2
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    depends_on:
      - jellyfin
      - cryptpad
    profiles:
      - tunnel

  # --- Music acquisition stack: gluetun + slskd + beets ---
  # slskd is a headless Soulseek client. ALL of its traffic is forced through
  # gluetun (Proton VPN over WireGuard) via network_mode, so nothing ever
  # touches the WAN un-tunneled — this is the isolation guarantee, not the
  # Cloudflare tunnel. gluetun owns the shared network namespace, so slskd has
  # no network/ports/labels of its own; its web UI (5030) is published through
  # gluetun and fronted by Traefik on gluetun's labels. beets tags/organizes
  # completed downloads into /media/Music (it only talks to MusicBrainz, so it
  # stays on the normal proxy network, not the VPN).
  gluetun:
    image: qmcgaw/gluetun:v3.41.0
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      # Interface address from the Proton WireGuard config (US-DC#43). IPv6
      # left off; the tunnel runs v4-only.
      - WIREGUARD_ADDRESSES=10.2.0.2/32
      # Keep egress in the US for latency; Proton US servers support P2P + PF.
      - SERVER_COUNTRIES=United States
      # Port forwarding via NAT-PMP. slskd reads the dynamic forwarded port
      # from the control server (see its SLSKD_VPN_* env) and keeps its listen
      # port in sync, so uploads stay reachable as the port rotates.
      - VPN_PORT_FORWARDING=on
      - TZ=America/Chicago
    # From OpenBao (kv/stacks/containers/gluetun-env): WIREGUARD_PRIVATE_KEY plus
    # HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE, a JSON blob applying API-key auth to
    # all control-server routes. Requires gluetun >= v3.41 (new /v1/portforward
    # API + env-based auth); v3.40 ignored the env var and couldn't protect that
    # route, so slskd (which polls /v1/portforward) got 401. slskd sends the
    # matching key as X-API-Key to poll the forwarded port and set its listen port.
    env_file:
      - ./gluetun.env
    labels:
      # slskd's web UI lives inside gluetun's netns; Traefik routes to it via
      # gluetun (the netns owner) at slskd.lan.quietlife.net.
      - "traefik.enable=true"
      - "traefik.http.routers.slskd.rule=Host(`slskd.lan.quietlife.net`)"
      - "traefik.http.routers.slskd.entrypoints=websecure"
      - "traefik.http.routers.slskd.tls=true"
      - "traefik.http.services.slskd.loadbalancer.server.port=5030"
    networks:
      - proxy

  slskd:
    image: slskd/slskd:0.24.4
    container_name: slskd
    restart: unless-stopped
    # Share gluetun's network namespace: all slskd traffic exits via the VPN.
    # gluetun's firewall blocks traffic until the tunnel is up, so no leak on
    # startup. No networks/ports/labels here — they live on gluetun.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - SLSKD_HTTP_PORT=5030
      - SLSKD_DOWNLOADS_DIR=/downloads
      # Share the whole music library back to the network (Soulseek etiquette
      # / ratio). slskd only reads it for sharing; imports are done by beets.
      - SLSKD_SHARED_DIR=/music
      # Native gluetun integration: slskd polls gluetun's control server for the
      # forwarded port and keeps its Soulseek listen port in sync — no sidecar.
      # The API key is the secret half (SLSKD_VPN_GLUETUN_API_KEY, from
      # slskd.env) and must match the key in gluetun-auth.toml.
      - SLSKD_VPN=true
      - SLSKD_VPN_PORT_FORWARDING=true
      - SLSKD_VPN_GLUETUN_URL=http://localhost:8000
    # Soulseek creds (SLSKD_SLSK_USERNAME/PASSWORD), web-UI/API auth
    # (SLSKD_USERNAME/PASSWORD), and the gluetun control-server key
    # (SLSKD_VPN_GLUETUN_API_KEY) rendered from OpenBao
    # (kv/stacks/containers/slskd-env).
    env_file:
      - ./slskd.env
    volumes:
      - slskd_config:/app
      - /mnt/nas/Media/Downloads/soulseek:/downloads
      - /mnt/nas/Media/Music:/music

  beets:
    image: lscr.io/linuxserver/beets:2.3.1
    container_name: beets
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - beets_config:/config
      - /mnt/nas/Media/Downloads/soulseek:/downloads
      - /mnt/nas/Media/Music:/music
    networks:
      - proxy

volumes:
  jellyfin_config:
  jellyfin_cache:
  sabnzbd_config:
  radarr_config:
  sonarr_config:
  paperless_redis:
  cryptpad_config:
  cryptpad_datastore:
  cryptpad_data:
  cryptpad_blob:
  cryptpad_block:
  cryptpad_customize:
  forgejo_data:
  forgejo_db:
  slskd_config:
  beets_config:

networks:
  proxy:
    name: proxy

