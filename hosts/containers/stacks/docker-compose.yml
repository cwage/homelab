services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/traefik/certs:ro
      - ./traefik-tls.yml:/etc/traefik/tls.yml:ro
      - ./traefik-basicauth:/etc/traefik/basicauth:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.lan.quietlife.net`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.usersfile=/etc/traefik/basicauth"
    networks:
      - proxy

  jellyfin:
    image: linuxserver/jellyfin:10.11.6
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.lan.quietlife.net`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    networks:
      - proxy
    devices:
      - "nvidia.com/gpu=all"

  sabnzbd:
    image: linuxserver/sabnzbd:4.5.5
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - sabnzbd_config:/config
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.lan.quietlife.net`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
    networks:
      - proxy

  radarr:
    image: linuxserver/radarr:6.0.4
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - radarr_config:/config
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.lan.quietlife.net`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    networks:
      - proxy

  sonarr:
    image: linuxserver/sonarr:4.0.16
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - sonarr_config:/config
      - /mnt/nas/Media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.lan.quietlife.net`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    networks:
      - proxy

  paperless-redis:
    image: docker.io/library/redis:8.0.5
    container_name: paperless-redis
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - paperless_redis:/data
    networks:
      - proxy

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.6
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-redis
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - USERMAP_UID=1000
      - USERMAP_GID=1000
      - PAPERLESS_TIME_ZONE=America/Chicago
      - PAPERLESS_URL=https://paperless.lan.quietlife.net
    volumes:
      - /mnt/nas/paperless/data:/usr/src/paperless/data
      - /mnt/nas/paperless/media:/usr/src/paperless/media
      - /mnt/nas/paperless/export:/usr/src/paperless/export
      - /mnt/nas/paperless/consume:/usr/src/paperless/consume
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.lan.quietlife.net`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.tls=true"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    networks:
      - proxy

  staticomment:
    image: ghcr.io/cwage/staticomment:0.3.0
    container_name: staticomment
    restart: unless-stopped
    environment:
      - STATICOMMENT_GIT_REPO=${STATICOMMENT_GIT_REPO}
      - STATICOMMENT_BRANCH=${STATICOMMENT_BRANCH:-main}
      - STATICOMMENT_ALLOWED_ORIGINS=${STATICOMMENT_ALLOWED_ORIGINS}
      - STATICOMMENT_TURNSTILE_SECRET=${STATICOMMENT_TURNSTILE_SECRET:-}
      - STATICOMMENT_SSH_KEY_PATH=/app/.ssh/id_ed25519
    volumes:
      - ./staticomment-ssh:/app/.ssh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staticomment.rule=Host(`staticomment.lan.quietlife.net`)"
      - "traefik.http.routers.staticomment.entrypoints=websecure"
      - "traefik.http.routers.staticomment.tls=true"
      - "traefik.http.services.staticomment.loadbalancer.server.port=8080"
    networks:
      - proxy

  # Public-only, exposed via the Cloudflare Tunnel at pad.quietlife.net.
  # CryptPad is end-to-end encrypted (the decryption key lives in the URL
  # fragment) and requires a SECOND "sandbox" origin for security isolation,
  # hence pad-sandbox.quietlife.net. cloudflared reaches it over the proxy
  # network: HTTP on :3000 and the realtime WebSocket on :3003
  # (/cryptpad_websocket) — both tunnel routes are configured in the
  # Cloudflare Zero Trust dashboard. OnlyOffice is intentionally not
  # installed; the markdown (Code) and rich-text apps don't need it.
  cryptpad:
    image: cryptpad/cryptpad:version-2026.5.1
    container_name: cryptpad
    restart: unless-stopped
    environment:
      - CPAD_MAIN_DOMAIN=https://pad.quietlife.net
      - CPAD_SANDBOX_DOMAIN=https://pad-sandbox.quietlife.net
      - CPAD_CONF=/cryptpad/config/config.js
    volumes:
      - cryptpad_config:/cryptpad/config
      - cryptpad_datastore:/cryptpad/datastore
      - cryptpad_data:/cryptpad/data
      - cryptpad_blob:/cryptpad/blob
      - cryptpad_block:/cryptpad/block
      - cryptpad_customize:/cryptpad/customize
    # CryptPad recommends a generous fd limit; 65536 is ample for this small
    # instance and well under any host's hard max (avoids host-dependent
    # `compose up` failures from over-requesting).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - proxy

  # Self-hosted git forge, evaluation instance for the GitHub migration
  # (issue #129 Phase 0). Web UI via Traefik at git.lan.quietlife.net;
  # git-over-SSH on host port 2222 (the VM's own sshd owns 22), which is
  # also the port advertised in clone URLs. INSTALL_LOCK skips the web
  # installer since config comes from these env vars; the admin account is
  # created via the forgejo CLI, and self-registration stays off.
  forgejo-db:
    image: postgres:17.10
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=forgejo
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD}
    volumes:
      - forgejo_db:/var/lib/postgresql/data
    networks:
      - proxy

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.5
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      - forgejo-db
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=America/Chicago
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - FORGEJO__server__DOMAIN=git.lan.quietlife.net
      - FORGEJO__server__ROOT_URL=https://git.lan.quietlife.net/
      - FORGEJO__server__SSH_DOMAIN=git.lan.quietlife.net
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
    volumes:
      - forgejo_data:/data
    ports:
      - "2222:22"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`git.lan.quietlife.net`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls=true"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
    networks:
      - proxy

  cloudflared:
    image: cloudflare/cloudflared:2026.1.2
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy
    depends_on:
      - jellyfin
      - cryptpad
    profiles:
      - tunnel

volumes:
  jellyfin_config:
  jellyfin_cache:
  sabnzbd_config:
  radarr_config:
  sonarr_config:
  paperless_redis:
  cryptpad_config:
  cryptpad_datastore:
  cryptpad_data:
  cryptpad_blob:
  cryptpad_block:
  cryptpad_customize:
  forgejo_data:
  forgejo_db:

networks:
  proxy:
    name: proxy

