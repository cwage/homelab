# Host-specific configuration for portanas (Synology DS1815+)
# DSM Version: 7.1.1-42962 Update 9

# NFS Shares Configuration
# Discovered shares: backup, Books, bp, caitstuff, docker, Documents, Downloads,
#   git, gitea-share, homes, Misc, Music, nextcloud, paperless-ngx, Pictures,
#   Plex, PlexMediaServer, readynas, Recording, swirbobackup, syncthing-data,
#   tb, usbshare1, Video

# Proxmox-specific NFS shares
# WARNING: do not run `make ansible-nas` until #120 is resolved. The role's
# /etc/exports writer fights DSM (which regenerates that file) and produces
# duplicate export entries; entries below are currently documentation of
# intent, applied by hand. See docs/immich.md for the manual steps.
nfs_shares:
  - name: pve-backups
    description: "Proxmox VE backup storage"
    path: /volume1/pve-backups
    nfs_enabled: true
    nfs_rules:
      - host: "10.10.15.0/24"
        privilege: "rw"
        squash: "no_root_squash"
        security: "sys"
        # Backups run as root on Proxmox, files will be owned by root (0:0)
        # no_root_squash allows Proxmox root to write as root on NAS

  - name: pve-templates
    description: "Proxmox ISO and template storage"
    path: /volume1/pve-templates
    nfs_enabled: true
    nfs_rules:
      - host: "10.10.15.0/24"
        privilege: "rw"
        squash: "no_root_squash"
        security: "sys"
        # Template/ISO management also runs as root on Proxmox

  - name: homelab-backups
    description: "Centralized backup storage for homelab VMs and containers"
    path: /volume1/homelab-backups
    nfs_enabled: true
    nfs_rules:
      - host: "10.10.15.0/24"
        privilege: "rw"
        squash: "no_root_squash"
        security: "sys"
        # VMs/containers create their own subdirs (vm/<hostname>/, container/<hostname>/)

  - name: immich
    description: "Immich upload location: thumbnails/previews, encoded video, DB dumps (issue #333)"
    path: /volume1/immich
    nfs_enabled: true
    nfs_rules:
      - host: "10.10.15.0/24"
        privilege: "rw"
        squash: "no_root_squash"
        security: "sys"
        # immich-server writes as uid 1000 (same as paperless); Postgres is NOT here.

# Key users discovered:
# - cwage (UID 1000, GID 100)
# - deploy (UID 1030, GID 100) - automation user
# - guest (UID 1025, GID 100) - anonymous NFS user
#
# Existing NFS exports use: anonuid=1025,anongid=100
# This maps all "nobody" access to the guest user

nas_users: []
nas_groups: []
