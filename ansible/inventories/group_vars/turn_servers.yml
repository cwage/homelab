---
# TURN relay server configuration

# SSH on alternate port (matching linode_vps pattern)
ssh_ports:
  - 22
  - 5344

managed_users:
  - name: deploy
    shell: /bin/bash
    groups: ["sudo"]
    sudo_nopasswd: true
    ssh_pubkey_file: "keys/deploy.pub"
  - name: cwage
    shell: /bin/bash
    groups: ["sudo"]
    sudo_nopasswd: false
    password_hash: "{{ lookup('community.hashi_vault.vault_kv2_get',
                       'infra/users/cwage',
                       engine_mount_point=openbao_kv_mount,
                       url=openbao_addr,
                       token=openbao_token,
                       validate_certs=openbao_validate_certs).secret.password_hash }}"
    ssh_pubkey_files:
      - "inventories/keys/cwage-portaplotz.pub"
      - "inventories/keys/cwage-portaptty.pub"
      - "inventories/keys/cwage-shot.pub"

# coturn auth secret from OpenBao
coturn_auth_secret: "{{ lookup('community.hashi_vault.vault_kv2_get',
                        'infra/coturn/auth',
                        engine_mount_point=openbao_kv_mount,
                        url=openbao_addr,
                        token=openbao_token,
                        validate_certs=openbao_validate_certs).secret.secret }}"

# External IP — set from inventory host_vars or override at deploy time
coturn_external_ip: "{{ ansible_host }}"
