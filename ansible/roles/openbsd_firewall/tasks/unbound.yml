---
- name: Install unbound package
  ansible.builtin.raw: /usr/sbin/pkg_add -I unbound
  become: true
  register: pkg_result
  changed_when: "'unbound' in pkg_result.stdout and 'already installed' not in pkg_result.stdout"

- name: Check for DNSSEC root trust anchor
  ansible.builtin.raw: test -s /var/unbound/db/root.key
  become: true
  register: root_key_check
  changed_when: false
  failed_when: false
  check_mode: false

# unbound-anchor exits 0 (anchor OK) or 1 (anchor was created/updated); treat
# anything else as a real failure. check_mode: false because the
# unbound-checkconf validation below requires the file to exist.
- name: Bootstrap DNSSEC root trust anchor
  ansible.builtin.raw: |
    /usr/sbin/unbound-anchor -a /var/unbound/db/root.key
    rc=$?
    if [ "$rc" -gt 1 ]; then echo "unbound-anchor failed with exit $rc" >&2; exit "$rc"; fi
    test -s /var/unbound/db/root.key
  become: true
  when: root_key_check.rc != 0
  check_mode: false

# _unbound must own the anchor (and its directory, for the temp files RFC 5011
# probes write) or rollover updates silently fail; enforce on every run
- name: Ensure _unbound owns the trust anchor
  ansible.builtin.raw: chown _unbound:_unbound /var/unbound/db /var/unbound/db/root.key
  become: true
  changed_when: false

- name: Write unbound.conf to temporary location
  ansible.builtin.raw: |
    cat > /tmp/unbound.conf.new << 'UNBOUND_EOF'
    {{ lookup('template', 'unbound.conf.j2') }}
    UNBOUND_EOF
  changed_when: false
  check_mode: false

- name: Validate new unbound.conf
  ansible.builtin.raw: /usr/sbin/unbound-checkconf /tmp/unbound.conf.new
  become: true
  changed_when: false
  check_mode: false

- name: Check if current config differs from new config
  ansible.builtin.raw: |
    if [ -f {{ unbound_conf_path }} ]; then
      diff -q {{ unbound_conf_path }} /tmp/unbound.conf.new
    else
      exit 1
    fi
  become: true
  register: config_diff
  changed_when: config_diff.rc != 0
  failed_when: false
  check_mode: false

- name: Deploy unbound.conf if validation passed
  ansible.builtin.raw: cat /tmp/unbound.conf.new | /usr/bin/tee {{ unbound_conf_path }} > /dev/null
  become: true
  when: config_diff.rc != 0
  notify: reload unbound

- name: Enable unbound service
  ansible.builtin.raw: /usr/sbin/rcctl enable unbound
  become: true
  changed_when: false

- name: Check if unbound is running
  ansible.builtin.raw: /usr/sbin/rcctl check unbound
  become: true
  register: unbound_status
  changed_when: false
  failed_when: false

- name: Start unbound service if not running
  ansible.builtin.raw: /usr/sbin/rcctl start unbound
  become: true
  when: unbound_status.rc | default(1) != 0
