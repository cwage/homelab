---
# Python is deliberately not installed on the firewall (hardening), so
# gather_facts is disabled and both roles use ansible.builtin.raw exclusively.
# become is disabled at the play level; tasks opt into it as needed via
# ansible_become_method=doas (configured in inventory). WireGuard must be
# configured before the firewall role deploys pf.conf, which references wg0.
- name: Manage OpenBSD Firewall
  hosts: openbsd_firewalls
  become: false
  gather_facts: false
  pre_tasks:
    - name: Retrieve doas password from OpenBao
      block:
        - name: Fetch deploy user doas password
          ansible.builtin.set_fact:
            ansible_become_password: "{{ lookup('community.hashi_vault.vault_kv2_get',
                                         'infra/users/deploy',
                                         engine_mount_point=openbao_kv_mount,
                                         url=openbao_addr,
                                         token=openbao_token,
                                         validate_certs=openbao_validate_certs).secret.password }}"
          no_log: true
      rescue:
        - name: Fail with helpful message
          ansible.builtin.fail:
            msg: >-
              Failed to retrieve doas password from OpenBao
              (secret: kv/infra/users/deploy, field: password).
              Check that BAO_TOKEN is set in .env, OpenBao is unsealed,
              and the secret exists (bao kv get kv/infra/users/deploy).
  roles:
    - wireguard_server
    - openbsd_firewall
