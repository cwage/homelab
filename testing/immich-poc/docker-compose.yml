# Immich proof-of-concept for the photo archive (issue #333).
#
# Runs on a workstation with an NVIDIA GPU, indexes /mnt/nas/Pictures in place
# (read-only external library). Derived from the upstream v3.2.2 compose file:
# https://github.com/immich-app/immich/releases/download/v3.2.2/docker-compose.yml
#
# Paths inside the containers deliberately match the homelab `containers` host
# (/mnt/nas/Pictures) so the index can be dumped/restored there later without
# re-scanning.

name: immich-poc

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /mnt/nas/Pictures:/mnt/nas/Pictures:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    # Hard cap so a runaway job OOM-kills this container, not the workstation.
    mem_limit: 24g
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-cuda
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${MODEL_CACHE_LOCATION}:/cache
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 8g
    healthcheck:
      disable: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
      - /etc/passwd:/etc/passwd:ro
    shm_size: 128mb
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      disable: false
