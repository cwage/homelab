# Only OpenTofu providers/modules stay on Dependabot. flake.lock, container
# images, and Actions pins are handled by self-hosted Renovate (renovate.json,
# modules/renovate.nix) so they come from one tool with one dashboard.
version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/tofu"
    schedule:
      interval: "weekly"
