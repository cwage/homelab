# sops-nix key configuration.
#
# Used only for hosts that cannot reach OpenBao. Everything on the LAN uses the
# openbao-agent module instead (see docs/nixos-migration.md); this exists
# because xmpp1 is a public VPS with no route to bao.lan.quietlife.net.
#
# Two recipients per secret:
#   - admin_cwage: a standalone age key on the workstation, so secrets can be
#     edited. Private half lives at ~/.config/sops/age/keys.txt and is NOT in
#     this repo — back it up in Bitwarden, it is the only way to decrypt these.
#   - host_xmpp1: xmpp1's SSH host key in age form, so the host can decrypt at
#     activation.
#
# Both were generated by scripts/bootstrap-xmpp1.sh. Public keys only below —
# safe to commit. See docs/xmpp.md.

keys:
  - &admin_cwage age1nspg4eyhy43gz6cyhkrvmwe04dafyed65lreu7a3gaaynhhqneusp7fh57
  - &host_xmpp1 age1t203mvyt6m9nj8k3kd2caxfm2482nvfuhh2u587gs25y6fqtug3qfg2ja3

creation_rules:
  - path_regex: secrets/xmpp1\.yaml$
    key_groups:
      - age:
          - *admin_cwage
          - *host_xmpp1
